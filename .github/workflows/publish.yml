name: Publish Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Resolve package version
        id: meta
        run: |
          python - <<'PY'
          import ast
          import os
          from pathlib import Path

          module = ast.parse(Path("src/chatboard/__init__.py").read_text(encoding="utf-8"))
          for stmt in module.body:
              if not isinstance(stmt, ast.Assign):
                  continue
              if any(isinstance(target, ast.Name) and target.id == "__version__" for target in stmt.targets):
                  version = ast.literal_eval(stmt.value)
                  break
          else:
              raise SystemExit("__version__ not found in src/chatboard/__init__.py")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"version={version}", file=output)
              print(f"tag=v{version}", file=output)
          PY
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if [ "${GITHUB_REF_NAME}" != "${RELEASE_TAG}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${RELEASE_TAG}."
            exit 1
          fi
      - name: Check release commit is on default branch
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "Release commit ${GITHUB_SHA} is not reachable from origin/main."
            exit 1
          fi
      - name: Check PyPI version
        env:
          PACKAGE_NAME: "ChatBoard"
          PACKAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          package = os.environ["PACKAGE_NAME"]
          version = os.environ["PACKAGE_VERSION"]
          url = f"https://pypi.org/pypi/{urllib.parse.quote(package)}/{urllib.parse.quote(version)}/json"
          try:
              urllib.request.urlopen(url, timeout=10)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  raise SystemExit(0)
              raise
          raise SystemExit(f"{package} {version} is already on PyPI")
          PY
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Build
        run: python -m build
      - name: Check dist
        run: python -m twine check dist/*
      - name: Publish to PyPI (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
