<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatBoard</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">ChatArch Workspace</p>
      <h1>ChatBoard</h1>
    </div>
    <div class="actions">
      <label class="ensure"><input id="ensureCards" type="checkbox"> ensure card.json</label>
      <button id="refreshBtn">Refresh</button>
    </div>
  </header>
  <main class="layout">
    <section class="board-shell">
      <div id="summary" class="summary">Loading...</div>
      <div id="emptyColumns" class="empty-columns"></div>
      <div id="board" class="board"></div>
    </section>
  </main>
  <div id="detailModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <article id="detailPanel" class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <header class="detail-head">
        <div>
          <p class="eyebrow">Project Card</p>
          <h2 id="detailTitle">Card detail</h2>
          <div id="detailPath" class="detail-path"></div>
        </div>
        <div class="detail-actions">
          <button id="fullscreenBtn" class="ghost" type="button">Fullscreen</button>
          <button id="closeDetailBtn" class="ghost" type="button">Close</button>
        </div>
      </header>
      <div id="detailBody" class="detail-body"></div>
    </article>
  </div>
  <script src="/assets/app.js"></script>
</body>
</html>
